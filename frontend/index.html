<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="welcome-section">
            <div class="logo">Campus<span>Connect</span></div>

            <div class="welcome-content">
                <p class="tagline">YOUR CAMPUS. YOUR COMMUNITY.</p>

                <h1>
                    Connect.<br>
                    Collaborate.<br>
                    <span>Grow.</span>
                </h1>

                <p class="description">
                    Your all-in-one student platform to connect with
                    classmates, discover opportunities, and stay
                    connected with campus life.
                </p>
            </div>
        </div>


        <!-- RIGHT SIDE -->
        <div class="login-section">

            <div class="login-card">

                <h2>Welcome back 👋</h2>

                <p class="login-subtitle">
                    Login to your CampusConnect account
                </p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="input-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>


                    <button type="submit" id="loginButton">
                        Login
                    </button>

                    <p id="message"></p>

                </form>

                <p class="register-text">
                    Don't have an account?
                    <a href="#" id="registerLink">Create one</a>
                </p>

            </div>

        </div>

    </div>

    <script src="script.js?v=3"></script>

</body>
</html>
