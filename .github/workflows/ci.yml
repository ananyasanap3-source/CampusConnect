name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Check server.js syntax
        working-directory: ./backend
        run: node --check server.js

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t campusconnect-backend .

      - name: Run container and test health endpoint
        run: |
          docker run -d -p 5000:5000 --name test-container campusconnect-backend
          sleep 3
          curl --fail http://localhost:5000/health || (docker logs test-container && exit 1)
          docker stop test-container